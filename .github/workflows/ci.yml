name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings

jobs:
  # Fast feedback: formatting and lints run once, not per-OS.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  # The real cross-platform gate. Transcend owns a PTY/pipe execution subsystem,
  # Windows Job Objects, Unix process groups and per-OS shell resolution, so a
  # single-OS build is not evidence that the crate works.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test (debug)
        run: cargo test --workspace
      # Search and traversal throughput is only meaningful in release mode, and
      # the release profile sets thin LTO, which debug builds never exercise.
      - name: cargo test (release)
        run: cargo test --workspace --release

  # Guards the published contract: the JSON schemas an MCP client configures
  # against must come from the live tool router, and must stay parseable.
  schemas:
    name: export MCP schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --release -p transcend-cli
      - name: export schemas
        run: ./target/release/transcend export-schemas --out schemas
      - name: verify every tool exported a well-formed schema
        run: |
          set -euo pipefail
          count=$(ls schemas/*.json | wc -l)
          echo "exported $count tool schemas"
          test "$count" -ge 23 || { echo "expected >= 23 tool schemas"; exit 1; }
          for f in schemas/*.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); assert d['name'] and d['description'] and isinstance(d['parameters'], dict), '$f'" \
              || { echo "malformed schema: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-tool-schemas
          path: schemas/
