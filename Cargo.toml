[workspace]
members = [
    "crates/transcend-protocol",
    "crates/transcend-core",
    "crates/transcend-server",
    "crates/transcend-cli",
]
exclude = ["rust-sdk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["pxin"]

[workspace.dependencies]
# In-workspace crates
transcend-protocol = { path = "crates/transcend-protocol" }
transcend-core = { path = "crates/transcend-core" }
transcend-server = { path = "crates/transcend-server" }

# MCP Rust SDK
rmcp = { path = "rust-sdk/crates/rmcp", default-features = false }

# Serialization & Schemas
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["derive"] }

# Ripgrep Engine Primitives
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ignore = "0.4.33"
globset = "0.4"

# Async & Runtime
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
anyhow = "1.0"
thiserror = "2.0"

