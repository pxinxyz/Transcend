[workspace]
members = [
    "crates/transcend-protocol",
    "crates/transcend-core",
    "crates/transcend-server",
    "crates/transcend-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["pxin"]
repository = "https://github.com/pxinxyz/Transcend"
homepage = "https://github.com/pxinxyz/Transcend"
readme = "README.md"
description = "The High-Performance Native Codebase Intelligence Engine for AI Agents"

[workspace.dependencies]
# In-workspace crates
transcend-protocol = { path = "crates/transcend-protocol" }
transcend-core = { path = "crates/transcend-core" }
transcend-server = { path = "crates/transcend-server" }

# MCP Rust SDK
rmcp = { version = "3.3.0", default-features = false }

# Serialization & Schemas
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["derive"] }

# Ripgrep Engine Primitives
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.11"
ignore = "0.4.33"
globset = "0.4"

# Async & Runtime
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Tree-sitter AST Engines
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-dart = "0.2"
tree-sitter-zig = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"

